name: Deploy Nuxt Static to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      # Only cache generated assets. Source images always come from this checkout.
      # The script validates each entry against source content and encoding settings.
      - name: Restore optimized images
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/image-optimization
          key: ${{ runner.os }}-images-v1-${{ hashFiles('scripts/optimize-images.js', 'pnpm-lock.yaml') }}-${{ hashFiles('public/**') }}
          restore-keys: |
            ${{ runner.os }}-images-v1-${{ hashFiles('scripts/optimize-images.js', 'pnpm-lock.yaml') }}-

      - name: Optimize images
        run: pnpm optimize:images

      # Save before the site build so unrelated build failures don't discard the work.
      - name: Save optimized images
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/image-optimization
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Generate static site
        env:
          # Prefer a personal token so private repositories are included in the count.
          # Fall back to the ephemeral Actions token for public-only statistics.
          GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        # Images were optimized above; invoke Nuxt directly to avoid pregenerate twice.
        run: pnpm exec nuxt generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
