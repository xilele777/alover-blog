  <title id="title">河声入藏 · 立体珐琅徽章</title>
  <desc id="desc">透明背景的纯矢量徽章。抛光金属边缘、深青珐琅、金色浮雕河流与象牙色乐谱，采用渐变和矢量阴影表现浅浮雕。</desc>
